<!-- The Aero edition is now a look of the main app: choose it (remembered on this device, as the Design menu would)
     and go there, keeping any ?loc= or ?place= so old links and home-screen icons still open the same place.
     The first Aero edition is kept as a sample at designs/aero-2026/. -->
<script>
try{localStorage.setItem("aus-forecast-design","aero");}catch(e){}
(function(){var q=new URLSearchParams(location.search),k=new URLSearchParams();
  ["loc","place"].forEach(function(n){if(q.has(n))k.set(n,q.get(n));});
  var s=k.toString();location.replace("../"+(s?"?"+s:"")+location.hash);})();
</script>
<style>body{margin:0;padding:40px 20px;font:16px/1.5 "Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;color:#0e2c44;background:linear-gradient(180deg,#0b6fd0,#a9e2fb 70%,#e9fbff) fixed;text-align:center}a{color:#0a5fa8;font-weight:600}p{max-width:30em;margin:0 auto;padding:16px 20px;border-radius:14px;background:rgb(255 255 255/.85)}</style>
</head>
<body>
<p>The Aero edition is now part of Consolidated Weather. <a href="../">Open Consolidated Weather</a>, then choose Aero edition from the Design button in the bottom corner if it isn't showing.</p>
<noscript><p>This page needs JavaScript to switch the look for you. Use the link above, then choose Aero edition from the Design button.</p></noscript>
</body>
</html>
