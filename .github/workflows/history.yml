name: Forecast history
# Keeps each source's forecasts and what the Bureau station recorded, for the app's accuracy scoreboard.
# Its own workflow, so a failure here never holds up the forecast scrape.

on:
  workflow_dispatch:
  schedule:
    # Hourly, between the scrape's runs (:07 and :37). Each run snapshots the forecasts and works out the
    # results for days just finished; hourly keeps the last forecast made before each day began, and catches
    # the station's max and min soon after they happen, even when GitHub starts some runs late or skips them
    - cron: "20 * * * *"

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/history.yml
      - name: Install
        run: pip install requests==2.32.3 tzdata
      - name: Update history
        run: python scraper/history.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data/history
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update forecast history $(date -u +%Y-%m-%dT%H:%MZ)"
          # The scrape commits every 30 minutes too; only this workflow writes data/history, so keep this run's files
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1
